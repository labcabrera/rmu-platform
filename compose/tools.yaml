# Optional development tools. They depend on infrastructure services, so enable this
# profile together with `infrastructure`.
services:
  rmu-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rmu-kafka-ui
    profiles:
      - tools
    depends_on:
      - rmu-kafka
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: rmu-kafka-broker:9092
      KAFKA_CLUSTERS_0_READONLY: false
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}

  rmu-mongo-express:
    image: mongo-express:1.0
    container_name: rmu-mongo-express
    profiles:
      - tools
    depends_on:
      rmu-mongo:
        condition: service_healthy
    ports:
      - "8092:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
