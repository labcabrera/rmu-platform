# Backend APIs, consumed as published images. Pin versions with RMU_API_<NAME>_VERSION in .env.
# Every API depends on rmu-mongo and rmu-kafka, so enable this profile together with
# `infrastructure`. Services call each other at http://rmu-api-<name>:<port>/v1.
#
# Variable names follow the RMU convention (docs/architecture/configuration.adoc): RMU_MONGO_<NAME>_URI,
# RMU_IAM_*, RMU_KAFKA_*, RMU_API_<NAME>_URI and RMU_<NAME>_<SETTING>. A few APIs still read an older
# name in their published images; those values are also set under the old name, marked "legacy".
# Remove each legacy line once the API releases a version that reads the new name.

# Mongo + Kafka dependency shared by every API that persists data or publishes events.
x-api-common: &api-common
  profiles:
    - apis
  depends_on:
    rmu-mongo:
      condition: service_healthy
    rmu-kafka:
      condition: service_healthy

x-iam-env: &iam-env
  RMU_IAM_JWK_URI: ${RMU_IAM_BASE_URI}/realms/${RMU_IAM_REALM}/protocol/openid-connect/certs
  RMU_IAM_TOKEN_URI: ${RMU_IAM_BASE_URI}/realms/${RMU_IAM_REALM}/protocol/openid-connect/token
  RMU_IAM_CLIENT_ID: ${RMU_IAM_CLIENT_ID}
  RMU_IAM_CLIENT_SECRET: ${RMU_IAM_CLIENT_SECRET}

x-kafka-env: &kafka-env
  RMU_KAFKA_BROKERS: ${RMU_KAFKA_BROKERS}
  RMU_KAFKA_DEFAULT_PARTITIONS: 1

x-log-env: &log-env
  LOG_LEVEL: ${LOG_LEVEL}

services:
  rmu-api-core:
    <<: *api-common
    image: labcabrera/rmu-api-core:${RMU_API_CORE_VERSION:-latest}
    container_name: rmu-api-core
    ports:
      - "3001:3001"
    environment:
      <<: [*iam-env, *kafka-env, *log-env]
      PORT: 3001
      RMU_MONGO_CORE_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-core?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-core

  rmu-api-strategic:
    <<: *api-common
    image: labcabrera/rmu-api-strategic:${RMU_API_STRATEGIC_VERSION:-latest}
    container_name: rmu-api-strategic
    ports:
      - "3002:3002"
    environment:
      <<: [*iam-env, *kafka-env, *log-env]
      PORT: 3002
      RMU_MONGO_STRATEGIC_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-strategic?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-strategic
      RMU_KAFKA_CONSUMER_GROUP_ID: rmu-api-strategic-consumer
      RMU_API_CORE_URI: http://rmu-api-core:3001/v1
      RMU_API_ITEMS_URI: http://rmu-api-items:3006/v1

  rmu-api-tactical:
    <<: *api-common
    image: labcabrera/rmu-api-tactical:${RMU_API_TACTICAL_VERSION:-latest}
    container_name: rmu-api-tactical
    ports:
      - "3003:3003"
    environment:
      <<: [*iam-env, *kafka-env]
      PORT: 3003
      RMU_MONGO_TACTICAL_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-tactical?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-tactical
      RMU_KAFKA_CONSUMER_GROUP_ID: rmu-api-tactical-consumer
      RMU_API_CORE_URI: http://rmu-api-core:3001/v1
      RMU_API_STRATEGIC_URI: http://rmu-api-strategic:3002/v1
      RMU_API_ITEMS_URI: http://rmu-api-items:3006/v1
      RMU_API_NPCS_URI: http://rmu-api-npcs:3008/v1
      RMU_API_ATTACK_URI: http://rmu-api-attack:8000/v1
      # legacy: read by rmu-api-tactical images before feature/env-vars-alignment.
      RMU_API_NPC_URI: http://rmu-api-npcs:3008/v1

  rmu-api-attack:
    image: labcabrera/rmu-api-attack:${RMU_API_ATTACK_VERSION:-latest}
    container_name: rmu-api-attack
    profiles:
      - apis
    depends_on:
      rmu-mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *log-env
      RMU_MONGO_ATTACK_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-attack?authSource=admin
      RMU_MONGO_ATTACK_DATABASE: rmu-attack
      RMU_API_ATTACK_TABLES_URI: http://rmu-api-attack-tables:3005/v1
      # legacy: read by rmu-api-attack images before feature/env-vars-alignment.
      RMU_API_ATTACK_TABLES_URL: http://rmu-api-attack-tables:3005/v1

  rmu-api-attack-tables:
    image: labcabrera/rmu-api-attack-tables:${RMU_API_ATTACK_TABLES_VERSION:-latest}
    container_name: rmu-api-attack-tables
    profiles:
      - apis
    ports:
      - "3005:3005"
    environment:
      PORT: 3005

  rmu-api-items:
    <<: *api-common
    image: labcabrera/rmu-api-items:${RMU_API_ITEMS_VERSION:-latest}
    container_name: rmu-api-items
    ports:
      - "3006:3006"
    environment:
      <<: [*iam-env, *kafka-env]
      PORT: 3006
      RMU_MONGO_ITEMS_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-items?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-items
      RMU_API_CORE_URI: http://rmu-api-core:3001/v1

  rmu-api-npc-names:
    image: labcabrera/rmu-api-npc-names:${RMU_API_NPC_NAMES_VERSION:-latest}
    container_name: rmu-api-npc-names
    profiles:
      - apis
    ports:
      - "3007:3007"
    environment:
      PORT: 3007

  # rmu-api-npcs is not checked out in this workspace, so its variables were not aligned yet: it
  # reads RMU_IAM_BASE_URL and RMU_KAFKA_PARTITION_COUNT instead of the common names.
  rmu-api-npcs:
    <<: *api-common
    image: labcabrera/rmu-api-npcs:${RMU_API_NPCS_VERSION:-latest}
    container_name: rmu-api-npcs
    ports:
      - "3008:3008"
    environment:
      <<: [*iam-env, *kafka-env, *log-env]
      PORT: 3008
      RMU_MONGO_NPCS_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-npcs?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-npcs
      RMU_API_CORE_URI: http://rmu-api-core:3001/v1
      RMU_API_ITEMS_URI: http://rmu-api-items:3006/v1
      RMU_API_ATTACK_TABLES_URI: http://rmu-api-attack-tables:3005/v1
      RMU_IAM_BASE_URL: ${RMU_IAM_BASE_URI}
      RMU_KAFKA_PARTITION_COUNT: '1'

  rmu-api-spells:
    <<: *api-common
    image: labcabrera/rmu-api-spells:${RMU_API_SPELLS_VERSION:-latest}
    container_name: rmu-api-spells
    ports:
      - "3009:3009"
    environment:
      <<: [*iam-env, *kafka-env]
      PORT: 3009
      RMU_MONGO_SPELLS_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-spells?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-spells

  rmu-api-users:
    <<: *api-common
    image: labcabrera/rmu-api-users:${RMU_API_USERS_VERSION:-latest}
    container_name: rmu-api-users
    ports:
      - "3010:3010"
    environment:
      <<: [*iam-env, *kafka-env]
      PORT: 3010
      RMU_MONGO_USERS_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-users?authSource=admin
      RMU_IAM_ADMIN_URI: ${RMU_IAM_BASE_URI}/admin/realms/${RMU_IAM_REALM}
      RMU_KAFKA_CLIENT_ID: rmu-api-users
      RMU_KAFKA_CONSUMER_GROUP_ID: rmu-api-users-consumer
      # legacy: read by rmu-api-users images before feature/env-vars-alignment.
      RMU_IAM_JWKS_URI: ${RMU_IAM_BASE_URI}/realms/${RMU_IAM_REALM}/protocol/openid-connect/certs
      RMU_IAM_ADMIN_BASE_URL: ${RMU_IAM_BASE_URI}/admin/realms/${RMU_IAM_REALM}

  rmu-api-media:
    <<: *api-common
    image: labcabrera/rmu-api-media:${RMU_API_MEDIA_VERSION:-latest}
    container_name: rmu-api-media
    ports:
      - "3011:3011"
    environment:
      <<: [*iam-env, *kafka-env, *log-env]
      PORT: 3011
      RMU_MONGO_MEDIA_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@rmu-mongo:27017/rmu-media?authSource=admin
      RMU_KAFKA_CLIENT_ID: rmu-api-media
      RMU_MEDIA_S3_REGION: ${RMU_MEDIA_S3_REGION}
      RMU_MEDIA_S3_BUCKET: ${RMU_MEDIA_S3_BUCKET}
      RMU_MEDIA_S3_BASE_FOLDER: ${RMU_MEDIA_S3_BASE_FOLDER}
      RMU_MEDIA_S3_IMAGE_FOLDER: ${RMU_MEDIA_S3_IMAGE_FOLDER}
      RMU_MEDIA_S3_ACCESS_KEY_ID: ${RMU_MEDIA_S3_ACCESS_KEY_ID}
      RMU_MEDIA_S3_SECRET_ACCESS_KEY: ${RMU_MEDIA_S3_SECRET_ACCESS_KEY}
      RMU_MEDIA_S3_FORCE_PATH_STYLE: true
      RMU_MEDIA_S3_PUBLIC_BASE_URI: ${RMU_MEDIA_S3_PUBLIC_BASE_URI}
      RMU_MEDIA_IMAGE_MAX_WIDTH: 2048
      # legacy: read by rmu-api-media images before feature/env-vars-alignment.
      RMU_MEDIA_S3_PUBLIC_BASE_URL: ${RMU_MEDIA_S3_PUBLIC_BASE_URI}
