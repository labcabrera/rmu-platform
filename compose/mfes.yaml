# React micro-frontends as static nginx images, one per rmu-mfe-* repository. They publish no
# host port: the gateway (profile gateway) serves the shell at / and each remote at /mfe/<name>/,
# so the dev server of an MFE can take over its route when its container is stopped
# (`make mfe-dev s=<name>`). See docs/architecture/frontends.adoc.
#
# Each image renders its runtime configuration (env-config.js) from these variables. The shell's
# configuration is the one in effect inside the browser, so it carries the URLs of every remote and
# API. Paths are relative to the gateway origin, so they do not change between environments.
x-mfe-env: &mfe-env
  KC_URL: ${RMU_MFE_KC_URL:-http://localhost:8090}
  KC_REALM: ${KEYCLOAK_REALM}
  KC_CLIENT_ID: ${RMU_MFE_KC_CLIENT_ID:-rmu-client-front}
  RMU_MFE_ASSETS: ${RMU_MFE_ASSETS_URL:-http://localhost:4000/}
  RMU_MFE_I18N_BASE_URL: ${RMU_MFE_I18N_BASE_URL:-}
  RMU_MFE_CORE_PUBLIC_PATH: /mfe/core/
  RMU_MFE_STRATEGIC_PUBLIC_PATH: /mfe/strategic/
  RMU_MFE_TACTICAL_PUBLIC_PATH: /mfe/tactical/
  RMU_MFE_NPCS_PUBLIC_PATH: /mfe/npcs/
  RMU_MFE_ITEMS_PUBLIC_PATH: /mfe/items/
  RMU_MFE_SPELLS_PUBLIC_PATH: /mfe/spells/
  RMU_API_CORE_URL: /api/core/v1
  RMU_API_STRATEGIC_URL: /api/strategic/v1
  RMU_API_TACTICAL_URL: /api/tactical/v1
  RMU_API_ITEMS_URL: /api/items/v1
  RMU_API_ATTACK_TABLES_URL: /api/attack-tables/v1
  RMU_API_NPC_NAMES_URL: /api/npc-names/v1
  RMU_API_NPCS_URL: /api/npcs/v1
  RMU_API_SPELLS_URL: /api/spells/v1
  RMU_API_USERS_URL: /api/users/v1
  RMU_API_MEDIA_URL: /api/media/v1
  REACT_APP_CONTACT_API: ${RMU_MFE_CONTACT_API:-}
  REACT_APP_CONTACT_EMAIL: ${RMU_MFE_CONTACT_EMAIL:-}

services:
  rmu-mfe-shell:
    image: labcabrera/rmu-mfe-shell:${RMU_MFE_SHELL_VERSION:-latest}
    container_name: rmu-mfe-shell
    profiles:
      - mfes
    environment: *mfe-env

  rmu-mfe-core:
    image: labcabrera/rmu-mfe-core:${RMU_MFE_CORE_VERSION:-latest}
    container_name: rmu-mfe-core
    profiles:
      - mfes
    environment: *mfe-env
