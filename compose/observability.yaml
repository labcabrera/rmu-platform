# Grafana, Loki, Tempo, Prometheus and an OTel collector in a single container, with the
# datasources already provisioned. APIs export OTLP to rmu-otel:4317 (gRPC) or :4318 (HTTP);
# instrumenting each API is tracked in its own repository.
services:
  rmu-otel:
    image: grafana/otel-lgtm:${OTEL_LGTM_VERSION:-latest}
    hostname: rmu-otel
    container_name: rmu-otel
    profiles:
      - observability
    ports:
      - "3000:3000"   # Grafana (admin/admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - rmu-otel-data:/data
    # Grafana's health endpoint, up once the bundled services have started.
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  rmu-otel-data:
    driver: local
