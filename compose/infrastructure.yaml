# Shared infrastructure: every API depends on MongoDB and Kafka, and Keycloak issues the tokens.
services:
  rmu-mongo:
    image: mongo:8.0
    hostname: rmu-mongo
    container_name: rmu-mongo
    profiles:
      - infrastructure
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      # Kernel 6.19+ breaks tcmalloc's rseq usage (SERVER-121912). Let glibc own rseq
      # so mongod falls back to a safe allocator mode; harmless on older kernels.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - rmu-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rmu-postgres:
    image: postgres:16
    hostname: rmu-postgres
    container_name: rmu-postgres
    profiles:
      - infrastructure
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_KEYCLOAK}
    volumes:
      - rmu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rmu-keycloak:
    image: quay.io/keycloak/keycloak:26.3
    hostname: rmu-keycloak
    container_name: rmu-keycloak
    profiles:
      - infrastructure
    depends_on:
      rmu-postgres:
        condition: service_healthy
    command:
      - start
      - --features=scripts
      - --http-enabled=true
      - --hostname=${KC_HOSTNAME}
    ports:
      - "8090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: rmu-postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB_KEYCLOAK}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public URL, also the token issuer (RMU_IAM_ISSUER_URI). The backchannel stays dynamic, so the
      # APIs reach Keycloak at http://rmu-keycloak:8080/sso and the issuer is still the public URL.
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HTTP_RELATIVE_PATH: /sso
      KC_LOG_LEVEL: INFO
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true
      # /sso/health/* on the management port 9000 (not published; it inherits the relative path).
      KC_HEALTH_ENABLED: true
    volumes:
      - rmu-keycloak-data:/opt/keycloak/data
    # The image has no curl or wget: plain HTTP request through bash's /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /sso/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  rmu-kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: rmu-kafka-broker
    container_name: rmu-kafka-broker
    profiles:
      - infrastructure
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://rmu-kafka-broker:9092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@rmu-kafka-broker:9094'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - rmu-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/localhost/9092 && echo ok || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Local SMTP for Keycloak (password reset, email verification): every mail is caught and shown in
  # the web UI (http://localhost:${MAILPIT_UI_PORT}). Keycloak sends to rmu-mailpit:1025.
  rmu-mailpit:
    image: axllent/mailpit:v1.27
    hostname: rmu-mailpit
    container_name: rmu-mailpit
    profiles:
      - infrastructure
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rmu-mongo-data:
    driver: local
  rmu-keycloak-data:
    driver: local
  rmu-postgres-data:
    driver: local
  rmu-kafka-data:
    driver: local
