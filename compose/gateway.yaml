# Caddy gateway: a single origin for the shell, the remote MFEs (/mfe/<name>/), the APIs
# (/api/<name>/) and Keycloak (/sso/). Routes are in config/caddy/Caddyfile. Upstreams resolve
# per request, so the gateway starts with any subset of services running. A stopped MFE container
# falls back to its webpack dev server on the host (host.docker.internal).
services:
  rmu-gateway:
    image: caddy:${CADDY_VERSION:-2.10-alpine}
    container_name: rmu-gateway
    profiles:
      - gateway
    ports:
      - "${RMU_GATEWAY_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # busybox wget; 127.0.0.1 because localhost resolves to ::1 first.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
