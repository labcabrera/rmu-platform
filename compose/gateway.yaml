# nginx gateway with the same path prefixes the AWS ALB will use (/core/, /sso/, ...).
# Routes are listed in config/nginx/default.conf. Upstreams resolve per request, so the
# gateway starts with any subset of the APIs running.
services:
  rmu-gateway:
    image: nginx:1.27-alpine
    container_name: rmu-gateway
    profiles:
      - gateway
    ports:
      - "${RMU_GATEWAY_PORT:-80}:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
