# Local gateway. The path prefixes mirror the routing rules planned for the AWS ALB,
# so a client that works against http://localhost/<prefix>/ also works behind the ALB.
#
# Upstreams are resolved at request time through Docker's DNS (resolver + variables), so
# the gateway starts even when only some APIs are running; a missing one answers 502.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /sso {
    return 301 $uri/;
  }

  location /sso/ {
    set $upstream rmu-keycloak:8080;
    rewrite ^/sso/(.*)$ /$1 break;
    proxy_pass http://$upstream;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect / /sso/;
    proxy_cookie_path / /sso/;
  }

  location /core/ {
    set $upstream rmu-api-core:3001;
    rewrite ^/core/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /strategic/ {
    set $upstream rmu-api-strategic:3002;
    rewrite ^/strategic/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /tactical/ {
    set $upstream rmu-api-tactical:3003;
    rewrite ^/tactical/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /attack-tables/ {
    set $upstream rmu-api-attack-tables:3005;
    rewrite ^/attack-tables/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /attack/ {
    set $upstream rmu-api-attack:8000;
    rewrite ^/attack/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /items/ {
    set $upstream rmu-api-items:3006;
    rewrite ^/items/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /npc-names/ {
    set $upstream rmu-api-npc-names:3007;
    rewrite ^/npc-names/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /npcs/ {
    set $upstream rmu-api-npcs:3008;
    rewrite ^/npcs/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /spells/ {
    set $upstream rmu-api-spells:3009;
    rewrite ^/spells/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /users/ {
    set $upstream rmu-api-users:3010;
    rewrite ^/users/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /media/ {
    set $upstream rmu-api-media:3011;
    rewrite ^/media/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location = / {
    default_type text/plain;
    return 200 'RMU API Gateway';
  }

  location / {
    return 404;
  }
}
