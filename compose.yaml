# Local development stack. Each file under compose/ covers one layer and assigns its
# services to a profile; enable profiles with COMPOSE_PROFILES in .env
# (.env.example enables infrastructure,apis,mfes,gateway,tools):
#   infrastructure  MongoDB, PostgreSQL, Keycloak, Kafka, Mailpit, S3 (SeaweedFS)
#   apis            backend API containers (needs infrastructure)
#   mfes            React micro-frontends as static images (shell, remotes, assets)
#   tools           dev tools: Kafka UI (needs infrastructure)
#   gateway         Caddy gateway: shell at /, MFEs at /mfe/<name>/, APIs at /api/<name>/
#   observability   Grafana + OTel collector (grafana/otel-lgtm)
#   monitoring      Grafana Alloy shipping metrics and logs to Grafana Cloud (production, spec 103)
# See docs/local-development.adoc.
include:
  - compose/infrastructure.yaml
  - compose/tools.yaml
  - compose/apis.yaml
  - compose/mfes.yaml
  - compose/gateway.yaml
  - compose/observability.yaml
  - compose/monitoring.yaml

# Fixed name so containers started outside this file (e.g. `make docker-run` in an API repo)
# can join with --network rmu-network.
networks:
  default:
    name: rmu-network
