# Local development stack. Each file under compose/ covers one layer and assigns its
# services to a profile; enable profiles with COMPOSE_PROFILES in .env
# (.env.example enables infrastructure,apis,mfes,tools):
#   infrastructure  MongoDB, PostgreSQL, Keycloak, Kafka
#   apis            backend API containers (needs infrastructure)
#   mfes            React micro-frontends (none defined yet)
#   tools           dev tools: Kafka UI, Mongo Express (needs infrastructure)
#   gateway         nginx gateway with the same path routing as the AWS ALB
#   observability   Grafana + OTel collector (grafana/otel-lgtm)
# See docs/local-development.adoc.
include:
  - compose/infrastructure.yaml
  - compose/tools.yaml
  - compose/apis.yaml
  - compose/mfes.yaml
  - compose/gateway.yaml
  - compose/observability.yaml

# Fixed name so containers started outside this file (e.g. `make docker-run` in an API repo)
# can join with --network rmu-network.
networks:
  default:
    name: rmu-network
