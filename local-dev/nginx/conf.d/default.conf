server {
  listen 80;
  server_name localhost;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /sso {
    return 301 $uri/;
  }

  location /sso/ {
    proxy_pass http://rmu-keycloak:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect / /sso/;
    proxy_cookie_path / /sso/;
  }

  location /core/ {
    proxy_pass http://rmu-api-core:3001/;
  }

  location /strategic/ {
    proxy_pass http://rmu-api-strategic:3002/;
  }

  location /tactical/ {
    proxy_pass http://rmu-api-tactical:3003/;
  }

  location /attack-tables/ {
    proxy_pass http://rmu-api-attack-tables:3005/;
  }

  location /attack/ {
    proxy_pass http://rmu-api-attack:8000/;
  }

  location /items/ {
    proxy_pass http://rmu-api-items:3006/;
  }

  location = / {
    return 200 'RMU API Gateway';
    add_header Content-Type text/plain;
  }

  location / {
    return 404;
  }
}
